name: build-forge-on-release

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_OWNER: antoinezambelli
  UPSTREAM_REPO: forge
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/forge

jobs:

  determine:
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.upstream.outputs.tag }}
      revision: ${{ steps.upstream.outputs.revision }}
      should_build: ${{ steps.compare.outputs.should_build }}

    steps:

      # ============================================================
      # Step 1
      #
      # Latest Release のタグ名を取得する。
      # ============================================================
      - name: Get latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(
            gh api \
              repos/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/releases/latest \
              --jq '.tag_name'
          )

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Step 2
      #
      # Release が指している Commit SHA を取得する。
      #
      # この Commit SHA を Desired State とする。
      # ============================================================
      - name: Resolve release revision
        id: upstream
        run: |
          git init repo

          cd repo

          git remote add origin \
            https://github.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}.git

          git fetch \
            --depth=1 \
            origin \
            refs/tags/${{ steps.release.outputs.tag }}

          git checkout FETCH_HEAD

          REVISION=$(git rev-parse HEAD)

          echo "tag=${{ steps.release.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Step 3
      #
      # GHCR上の manifest annotation を取得する。
      #
      # pull は行わない。
      # image layer も取得しない。
      #
      # annotation に格納した
      # upstream revision
      # を読む。
      # ============================================================
      - name: Read current annotation
        id: current
        run: |

          CURRENT_REVISION=$(
            docker buildx imagetools inspect \
              ${IMAGE_NAME}:latest \
              --format '{{ index .Manifest "Annotations" "org.opencontainers.image.revision" }}' \
              2>/dev/null \
              || true
          )

          echo "revision=${CURRENT_REVISION}" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Step 4
      #
      # Desired State 判定。
      #
      # source commit SHA
      # と
      # image annotation
      # を比較する。
      # ============================================================
      - name: Compare desired state
        id: compare
        run: |

          CURRENT="${{ steps.current.outputs.revision }}"
          DESIRED="${{ steps.upstream.outputs.revision }}"

          echo "Current : $CURRENT"
          echo "Desired : $DESIRED"

          if [ -n "$CURRENT" ] && [ "$CURRENT" = "$DESIRED" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: determine

    if: needs.determine.outputs.should_build == 'true'

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Step 5
      #
      # Release Tag のソースを取得する。
      # Dockerfile は upstream のものを利用する。
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: antoinezambelli/forge
          ref: ${{ needs.determine.outputs.tag }}

      # ============================================================
      # Step 6
      #
      # Multi Arch Build 準備。
      # ============================================================
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================================
      # Step 7
      #
      # GHCR Login。
      # ============================================================
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # ============================================================
      # Step 8
      #
      # OCI Metadata。
      #
      # revision を annotation と label の両方へ格納する。
      #
      # 次回判定は annotation を利用する。
      # ============================================================
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}

          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.determine.outputs.tag }}

          labels: |
            org.opencontainers.image.version=${{ needs.determine.outputs.tag }}
            org.opencontainers.image.revision=${{ needs.determine.outputs.revision }}
            org.opencontainers.image.source=https://github.com/antoinezambelli/forge

      # ============================================================
      # Step 9
      #
      # Multi Arch Build。
      #
      # BuildKit Cache を利用する。
      #
      # cache は高速化用。
      # 判定には使用しない。
      # ============================================================
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          push: true

          platforms: |
            linux/amd64
            linux/arm64

          cache-from: type=gha
          cache-to: type=gha,mode=max

          annotations: |
            org.opencontainers.image.revision=${{ needs.determine.outputs.revision }}

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ============================================================
      # Step 10
      #
      # Manifest List Digest を出力する。
      #
      # digest は成果物識別用。
      # 判定には利用しない。
      # ============================================================
      - name: Output digest
        run: |
          echo "Digest: ${{ steps.build.outputs.digest }}"
