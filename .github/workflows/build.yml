name: Build Forge Image

on:
  workflow_dispatch:

  schedule:
    # 6時間ごとに Desired State を確認する
    - cron: "0 */6 * * *"

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_OWNER: antoinezambelli
  UPSTREAM_REPO: forge
  IMAGE_NAME: forge

jobs:

  determine:
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.upstream.outputs.tag }}
      revision: ${{ steps.upstream.outputs.revision }}
      should_build: ${{ steps.compare.outputs.should_build }}

    steps:

      # ============================================================
      # Step 1
      #
      # upstream の Latest Release を取得する。
      #
      # まず release tag を取得する。
      # ============================================================
      - name: Get latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(
            gh api \
              repos/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/releases/latest \
              --jq '.tag_name'
          )

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Step 2
      #
      # Release Tag が指している Commit SHA を取得する。
      #
      # Desired State の正体は tag ではなく commit。
      # ============================================================
      - name: Resolve release revision
        id: upstream
        run: |
          git init forge

          cd forge

          git remote add origin \
            https://github.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}.git

          git fetch \
            --depth=1 \
            origin \
            refs/tags/${{ steps.release.outputs.tag }}

          git checkout FETCH_HEAD

          REVISION=$(git rev-parse HEAD)

          echo "tag=${{ steps.release.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Step 3
      #
      # GHCR の OCI Index を取得する。
      #
      # pull は行わない。
      #
      # OCI Index →
      # amd64 manifest →
      # config digest
      #
      # を取得する。
      # ============================================================
      - name: Resolve current image config digest
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |

          TOKEN=$(curl -fsSL \
            "https://ghcr.io/token?scope=repository:${OWNER}/${IMAGE_NAME}:pull" \
            | jq -r '.token')

          INDEX_JSON=$(
            curl -fsSL \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.oci.image.index.v1+json" \
              "https://ghcr.io/v2/${OWNER}/${IMAGE_NAME}/manifests/latest"
          ) || true

          if [ -z "${INDEX_JSON}" ]; then
            echo "revision=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AMD64_DIGEST=$(
            echo "${INDEX_JSON}" |
            jq -r '
              .manifests[]
              | select(.platform.architecture=="amd64")
              | .digest
            ' | head -n1
          )

          MANIFEST_JSON=$(
            curl -fsSL \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.oci.image.manifest.v1+json" \
              "https://ghcr.io/v2/${OWNER}/${IMAGE_NAME}/manifests/${AMD64_DIGEST}"
          )

          CONFIG_DIGEST=$(
            echo "${MANIFEST_JSON}" |
            jq -r '.config.digest'
          )

          echo "config_digest=${CONFIG_DIGEST}" >> "$GITHUB_OUTPUT"

          CONFIG_JSON=$(
            curl -fsSL \
              -H "Authorization: Bearer ${TOKEN}" \
              "https://ghcr.io/v2/${OWNER}/${IMAGE_NAME}/blobs/${CONFIG_DIGEST}"
          )

          CURRENT_REVISION=$(
            echo "${CONFIG_JSON}" |
            jq -r '
              .config.Labels["org.opencontainers.image.revision"]
              // empty
            '
          )

          echo "revision=${CURRENT_REVISION}" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Step 4
      #
      # Desired State 判定。
      #
      # source commit SHA
      # と
      # image label revision
      #
      # のみを比較する。
      # ============================================================
      - name: Compare desired state
        id: compare
        run: |

          CURRENT="${{ steps.image.outputs.revision }}"
          DESIRED="${{ steps.upstream.outputs.revision }}"

          echo "Current revision : ${CURRENT}"
          echo "Desired revision : ${DESIRED}"

          if [ -n "${CURRENT}" ] &&
             [ "${CURRENT}" = "${DESIRED}" ]; then

            echo "Desired state achieved"

            echo "should_build=false" >> "$GITHUB_OUTPUT"

          else

            echo "Drift detected"

            echo "should_build=true" >> "$GITHUB_OUTPUT"

          fi

  build:
    needs: determine

    if: needs.determine.outputs.should_build == 'true'

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Step 5
      #
      # Release Tag のソースを取得する。
      #
      # upstream Dockerfile をそのまま利用する。
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: antoinezambelli/forge
          ref: ${{ needs.determine.outputs.tag }}

      # ============================================================
      # Step 6
      #
      # ARM64 build 用。
      # ============================================================
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      # ============================================================
      # Step 7
      #
      # Multi Arch Builder。
      # ============================================================
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================================
      # Step 8
      #
      # GHCR Login。
      # ============================================================
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # ============================================================
      # Step 9
      #
      # OCI Metadata。
      #
      # revision は次回比較のために埋め込む。
      # ============================================================
      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/forge

          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.determine.outputs.tag }}

          labels: |
            org.opencontainers.image.source=https://github.com/antoinezambelli/forge
            org.opencontainers.image.version=${{ needs.determine.outputs.tag }}
            org.opencontainers.image.revision=${{ needs.determine.outputs.revision }}

      # ============================================================
      # Step 10
      #
      # Multi Arch Build。
      #
      # cache はビルド高速化専用。
      # 判定には利用しない。
      # ============================================================
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          push: true

          platforms: |
            linux/amd64
            linux/arm64

          cache-from: type=gha
          cache-to: type=gha,mode=max

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ============================================================
      # Step 11
      #
      # Manifest Digest を出力する。
      #
      # digest は成果物識別用。
      # 判定には使わない。
      # ============================================================
      - name: Show digest
        run: |
          echo "Digest: ${{ steps.build.outputs.digest }}"
